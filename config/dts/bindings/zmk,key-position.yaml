description: Key position for ZMK physical layout

compatible: "zmk,key-position"

properties:
  x:
    type: int
    required: true
  y:
    type: int
    required: true
  width:
    type: int
    default: 1
  height:
    type: int
    default: 1
  "#key-cells":
    type: int
    const: 4
